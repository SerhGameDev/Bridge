name: Bridge.Core CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test-pack:
    name: .NET build, tests and package
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Bridge.sln
      - run: dotnet build Bridge.sln -c Release --no-restore
      - run: dotnet test Bridge.sln -c Release --no-build --logger trx --results-directory work/test-results/ci
      - run: dotnet run --project samples/Bridge.Console.Sample -c Release --no-build
      - run: dotnet pack src/Bridge.Core/Bridge.Core.csproj -c Release --no-build -o work/packages
